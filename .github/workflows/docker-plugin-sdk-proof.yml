name: Docker plugin SDK alias proof

on:
  push:
    branches: [fix/docker-plugin-sdk-alias]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "26.12.1"
          install-bun: "false"
          cache-mode: "off"
      - name: Format candidate files remotely
        run: |
          pnpm exec oxfmt --write scripts/lib/root-package-bundled-plugin-excludes.mjs test/scripts/bundled-plugin-build-entries.test.ts test/scripts/prune-docker-plugin-dist.test.ts scripts/e2e/onepassword-sdk-docker-proof.mjs
          git diff > "$RUNNER_TEMP/remote-format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: remote-format
          path: ${{ runner.temp }}/remote-format.patch
      - name: Run the desired collector and prune contracts
        run: node scripts/run-vitest.mjs test/scripts/bundled-plugin-build-entries.test.ts test/scripts/prune-docker-plugin-dist.test.ts test/scripts/docker-plugin-selection.test.ts test/scripts/stage-bundled-plugin-runtime.test.ts test/scripts/desktop-runtime-plugins.test.ts test/scripts/bun-standalone-plugins.test.ts test/scripts/build-external-plugin-local-dist.test.ts --maxWorkers=1
      - name: Lint changed tooling
        run: node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.tooling.json scripts/lib/root-package-bundled-plugin-excludes.mjs test/scripts/bundled-plugin-build-entries.test.ts test/scripts/prune-docker-plugin-dist.test.ts scripts/e2e/onepassword-sdk-docker-proof.mjs
      - name: Typecheck tooling consumers
        run: node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.test.root.tooling.json --noEmit
      - name: Check workflow and docs inventory
        run: |
          pnpm check:workflows
          pnpm docs:list

  official-image:
    # Image proof is already pinned to the production fix. Formatting/lint-only
    # pushes need tooling checks; dispatch this job again if image inputs change.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the official Dockerfile with onepassword selected
        shell: bash
        run: |
          set -euo pipefail
          docker build --file Dockerfile --tag openclaw-onepassword-sdk-proof:current \
            --build-arg OPENCLAW_EXTENSIONS=onepassword \
            --build-arg OPENCLAW_DOCKER_BUILD_NODE_OPTIONS=--max-old-space-size=6144 \
            --progress=plain . > "$RUNNER_TEMP/openclaw-docker-build.log" 2>&1 || {
              tail -n 180 "$RUNNER_TEMP/openclaw-docker-build.log"
              exit 1
            }
          docker image inspect openclaw-onepassword-sdk-proof:current \
            --format 'image={{.Id}} user={{.Config.User}} size={{.Size}}'
      - name: Exercise shipped static resolver with synthetic op and no network
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 1g --cpus 2 \
            --mount type=bind,source="$GITHUB_WORKSPACE/scripts/e2e/onepassword-sdk-docker-proof.mjs",target=/proof/onepassword-sdk-docker-proof.mjs,readonly \
            --entrypoint node openclaw-onepassword-sdk-proof:current \
            /proof/onepassword-sdk-docker-proof.mjs
