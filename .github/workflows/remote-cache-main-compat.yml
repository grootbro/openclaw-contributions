name: Remote cache main compatibility
on:
  push:
    branches: [proof/remote-cache-main-compat]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.12.1
          install-bun: "false"
          cache-mode: "off"
      - name: Regenerate canonical runtime artifacts remotely
        run: |
          pnpm runtime:scripts:gen
          pnpm exec oxfmt --write src/gateway/worker-environments/workspace-sync-scripts.ts src/gateway/worker-environments/workspace-generated-paths.test.ts docs/gateway/sandboxing/workspace-access.md test/e2e/qa-lab/runtime/native-worker-build-cache.e2e.test.ts
          pnpm runtime:scripts:check
          git diff > "$RUNNER_TEMP/remote-generation.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: remote-generation
          path: ${{ runner.temp }}/remote-generation.patch
