name: Remote cache main compatibility
on:
  push:
    branches: [proof/remote-cache-main-compat]
permissions:
  contents: read
jobs:
  generated-lint-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.12.1
          install-bun: "false"
          cache-mode: "off"
      - name: Regenerate artifacts from the corrected generator
        run: |
          pnpm runtime:scripts:gen
          pnpm runtime:scripts:check
          git diff > "$RUNNER_TEMP/remote-generation.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lint-repair-generation
          path: ${{ runner.temp }}/remote-generation.patch
      - name: Check generated runtime lint and canonical callers
        run: node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/gateway/worker-environments/workspace-sync-scripts.ts src/gateway/worker-environments/workspace-generated-paths.test.ts src/gateway/worker-environments/workspace-manifest-script.generated.mjs src/node-host/node-worker-workspace-manifest.generated.worker.mjs
      - name: Lint and format the generator
        run: |
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.scripts.json scripts/generate-runtime-script-assets.mjs
          pnpm exec oxfmt --check scripts/generate-runtime-script-assets.mjs
      - name: Verify generation freshness and both capture runtimes
        run: node scripts/run-vitest.mjs test/scripts/runtime-script-assets.test.ts src/gateway/worker-environments/workspace-manifest-script.runtime.test.ts src/gateway/worker-environments/workspace-generated-paths.test.ts --maxWorkers=1
