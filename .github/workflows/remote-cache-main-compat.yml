name: Remote cache main compatibility
on:
  push:
    branches: [proof/remote-cache-main-compat]
permissions:
  contents: read
jobs:
  capture-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.12.1
          install-bun: "false"
          cache-mode: "off"
      - name: Regenerate canonical runtime assets
        run: |
          pnpm runtime:scripts:gen
          pnpm runtime:scripts:check
          git diff > "$RUNNER_TEMP/remote-generation.patch"
          git diff --name-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: remote-cache-oct27-generation
          path: ${{ runner.temp }}/remote-generation.patch
      - name: Verify committed generation is unchanged
        run: test ! -s "$RUNNER_TEMP/remote-generation.patch"
