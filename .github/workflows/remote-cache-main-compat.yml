name: Remote cache main compatibility
on:
  push:
    branches: [proof/remote-cache-main-compat]
permissions:
  contents: read
jobs:
  capture-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.12.1
          install-bun: "false"
          cache-mode: "off"
      - name: Verify canonical generated assets and formatting
        run: |
          pnpm runtime:scripts:check
          pnpm exec oxfmt --check src/gateway/worker-environments/workspace-sync-scripts.ts src/gateway/worker-environments/workspace-generated-paths.test.ts test/e2e/qa-lab/runtime/native-worker-build-cache.e2e.test.ts docs/gateway/sandboxing/workspace-access.md
      - name: Exercise capture and its native and SSH consumers
        run: node scripts/run-vitest.mjs src/gateway/worker-environments/workspace-generated-paths.test.ts src/node-host/node-worker-workspace-manifest.test.ts src/gateway/worker-environments/workspace-sync*.test.ts src/gateway/worker-environments/node-workspace-transfer-service.test.ts src/gateway/worker-environments/workspace-manifest-script.runtime.test.ts test/scripts/runtime-script-assets.test.ts --maxWorkers=1
      - name: Lint core changes
        run: node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/gateway/worker-environments/workspace-sync-scripts.ts src/gateway/worker-environments/workspace-generated-paths.test.ts
      - name: Lint native runtime proof
        run: node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.json test/e2e/qa-lab/runtime/native-worker-build-cache.e2e.test.ts
      - name: Typecheck Gateway tests
        run: node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.gateway-other.json --noEmit
      - name: Typecheck native runtime proof
        run: node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.test.root.e2e.json --noEmit
      - name: Docs sanity
        run: pnpm docs:list
  gateway-native-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_E2E_VERBOSE: "1"
      OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.12.1
          install-bun: "false"
          cache-mode: "off"
      - name: Build the production Gateway and private QA runtime
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
        run: pnpm build qaRuntime
      - name: Prove build-cache handling through a real Gateway and native worker
        env:
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
        run: node scripts/run-vitest.mjs test/e2e/qa-lab/runtime/native-worker-build-cache.e2e.test.ts --maxWorkers=1
  unchanged-main-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.12.1
          install-bun: "false"
          cache-mode: "off"
      - name: Restore pinned main production programs without changing regression tests
        run: git restore --source=92b29153ddfca66bc54921e7f2ca686106d2a9fd -- src/gateway/worker-environments/workspace-sync-scripts.ts src/gateway/worker-environments/workspace-manifest-script.generated.mjs src/node-host/node-worker-workspace-manifest.generated.worker.mjs
      - name: Reproduce unreadable cache failures on unchanged main production
        run: node scripts/run-vitest.mjs src/gateway/worker-environments/workspace-generated-paths.test.ts --maxWorkers=1 -t "excludes unreadable build outputs while retaining authored inputs"
