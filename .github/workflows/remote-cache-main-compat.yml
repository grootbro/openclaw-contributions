name: Remote cache main compatibility
on:
  push:
    branches: [proof/remote-cache-main-compat]
permissions:
  contents: read
jobs:
  capture-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.12.1
          install-bun: "false"
          cache-mode: "off"
      - name: Regenerate canonical runtime assets
        run: |
          pnpm runtime:scripts:gen
          pnpm runtime:scripts:check
          git diff > "$RUNNER_TEMP/remote-generation.patch"
          git diff --name-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: remote-cache-oct27-generation
          path: ${{ runner.temp }}/remote-generation.patch
      - name: Check touched formatting and runtime lint
        run: |
          pnpm exec oxfmt --check scripts/generate-runtime-script-assets.mjs src/gateway/worker-environments/workspace-sync-scripts.ts src/gateway/worker-environments/workspace-generated-paths.test.ts docs/gateway/sandboxing/workspace-access.md
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/gateway/worker-environments/workspace-sync-scripts.ts src/gateway/worker-environments/workspace-generated-paths.test.ts src/gateway/worker-environments/workspace-manifest-script.generated.mjs src/node-host/node-worker-workspace-manifest.generated.worker.mjs
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.scripts.json scripts/generate-runtime-script-assets.mjs
      - name: Exercise callable, standalone, native and SSH consumers
        run: node scripts/run-vitest.mjs src/gateway/worker-environments/workspace-generated-paths.test.ts src/node-host/node-worker-workspace-manifest.test.ts src/gateway/worker-environments/workspace-sync*.test.ts src/gateway/worker-environments/node-workspace-transfer-service.test.ts src/gateway/worker-environments/workspace-manifest-script.runtime.test.ts test/scripts/runtime-script-assets.test.ts --maxWorkers=1
      - name: Typecheck Gateway tests
        run: node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.gateway-other.json --noEmit
      - name: Docs sanity
        run: pnpm docs:list
