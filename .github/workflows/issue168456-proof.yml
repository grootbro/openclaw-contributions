name: Issue 168456 current-main reproduction
on:
  push:
    branches: [fix/fallback-transcript-key]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.12.1
          install-bun: "false"
          cache-mode: "off"
      - name: Build the same private QA runtime used by upstream CI
        id: runtime
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
        run: pnpm build qaRuntime
      - name: Gateway reproduction with default context engine
        if: ${{ always() && steps.runtime.outcome == 'success' }}
        env:
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
        run: node scripts/run-vitest.mjs test/issue168456-current-main.e2e.test.ts --maxWorkers=1
      - name: Prepare pinned Lossless Claw package without scripts
        id: lossless
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/issue168456-lossless"
          npm pack @martian-engineering/lossless-claw@1.1.1 --ignore-scripts --pack-destination "$RUNNER_TEMP/issue168456-lossless" --json > "$RUNNER_TEMP/issue168456-lossless/package-receipt.json"
          python3 - <<'PYINTEGRITY'
          import base64,hashlib,json,os,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'issue168456-lossless'
          receipt=json.loads((root/'package-receipt.json').read_text())[0]
          expected='sha512-Bg/JTqU+cGdYdN/YeW2xMoc7qjSb+lirb+U3bHPc+gRQ/SyGKdLR+GEWrujE78ws9bhjjMEv+BUw5ZfyVwP+jA=='
          tarball=root/receipt['filename']
          actual='sha512-'+base64.b64encode(hashlib.sha512(tarball.read_bytes()).digest()).decode()
          assert actual==expected, 'Lossless package integrity mismatch'
          print('Lossless package 1.1.1 verified:',actual)
          with tarfile.open(tarball) as archive:
              archive.extractall(root, filter='data')
          PYINTEGRITY
          echo "ISSUE168456_LOSSLESS_PLUGIN=$RUNNER_TEMP/issue168456-lossless/package" >> "$GITHUB_ENV"
      - name: Gateway reproduction with actual Lossless Claw
        if: ${{ always() && steps.runtime.outcome == 'success' && steps.lossless.outcome == 'success' }}
        env:
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
          ISSUE168456_REQUIRE_LOSSLESS: "1"
        run: node scripts/run-vitest.mjs test/issue168456-current-main.e2e.test.ts --maxWorkers=1
