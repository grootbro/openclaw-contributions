name: Docker SDK test repair evidence
on:
  push:
    branches: [proof/docker-sdk-ci-repair]
permissions:
  contents: read
jobs:
  focused-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "false"
          cache-mode: "off"
      - name: Check formatting remotely
        run: pnpm exec oxfmt --check scripts/lib/root-package-bundled-plugin-excludes.mjs test/scripts/bundled-plugin-build-entries.test.ts test/scripts/prune-docker-plugin-dist.test.ts
      - name: Run seven owner and consumer suites
        run: node scripts/run-vitest.mjs test/scripts/bundled-plugin-build-entries.test.ts test/scripts/prune-docker-plugin-dist.test.ts test/scripts/docker-plugin-selection.test.ts test/scripts/stage-bundled-plugin-runtime.test.ts test/scripts/desktop-runtime-plugins.test.ts test/scripts/bun-standalone-plugins.test.ts test/scripts/build-external-plugin-local-dist.test.ts --maxWorkers=1
      - name: Typecheck actual script test callers
        run: node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.test.root.scripts.json --noEmit
      - name: Lint changed tooling with script test types
        run: node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.scripts.json scripts/lib/root-package-bundled-plugin-excludes.mjs test/scripts/bundled-plugin-build-entries.test.ts test/scripts/prune-docker-plugin-dist.test.ts
  unchanged-main-fs-safe-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 74cb12dd2c7597f0d9a388b94bb2b776cac6db25
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "false"
          cache-mode: "off"
      - name: Reproduce upstream relocated fs-safe failures without PR changes
        run: node scripts/run-vitest.mjs test/scripts/tsdown-config.test.ts --maxWorkers=1 -t "preserves fs-safe package ownership and policy in relocated"
