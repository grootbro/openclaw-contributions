name: Remote workspace build-cache proof
on:
  push:
    branches: [fix/remote-workspace-build-caches]
permissions:
  contents: read
jobs:
  capture-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.12.1
          install-bun: "false"
          cache-mode: "off"
      - name: Format changed sources remotely
        run: |
          pnpm exec oxfmt --write src/gateway/worker-environments/workspace-sync-scripts.ts src/gateway/worker-environments/workspace-generated-paths.test.ts test/e2e/qa-lab/runtime/native-worker-build-cache.e2e.test.ts docs/gateway/sandboxing/workspace-access.md
          git diff > /tmp/remote-format.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: remote-format
          path: /tmp/remote-format.patch
      - name: Exercise capture and its native and SSH consumers
        run: node scripts/run-vitest.mjs src/gateway/worker-environments/workspace-generated-paths.test.ts src/node-host/node-worker-workspace-manifest.test.ts src/gateway/worker-environments/workspace-sync*.test.ts src/gateway/worker-environments/node-workspace-transfer-service.test.ts --maxWorkers=1
      - name: Lint core changes
        run: node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/gateway/worker-environments/workspace-sync-scripts.ts src/gateway/worker-environments/workspace-generated-paths.test.ts
      - name: Lint native runtime proof
        run: node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.json test/e2e/qa-lab/runtime/native-worker-build-cache.e2e.test.ts
      - name: Typecheck Gateway tests
        run: node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.gateway-other.json --noEmit
      - name: Typecheck native runtime proof
        run: node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.test.root.e2e.json --noEmit
      - name: Docs sanity
        run: pnpm docs:list
  gateway-native-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_VITEST_RUNTIME: node
      OPENCLAW_E2E_VERBOSE: "1"
      OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.12.1
          install-bun: "false"
          cache-mode: "off"
      - name: Build the production Gateway and private QA runtime
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
        run: pnpm build qaRuntime
      - name: Prove build-cache handling through a real Gateway and native worker
        env:
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
        run: node scripts/run-vitest.mjs test/e2e/qa-lab/runtime/native-worker-build-cache.e2e.test.ts --maxWorkers=1
